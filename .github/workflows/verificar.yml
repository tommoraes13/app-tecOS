name: Verificar

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tipos e build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -o pipefail
          status=0
          npx tsc --noEmit --pretty false 2>&1 | tee tipos.log || status=1
          if [ $status -eq 0 ]; then
            npm run build 2>&1 | tee build.log || status=1
          fi
          if [ $status -eq 0 ]; then
            # A rota do PDF precisa levar as fontes padrão no pacote (sem elas o PDF falha na Vercel).
            f=$(find .next/server/app/api/pdf -name "route.js.nft.json" | head -1)
            if ! grep -q "standard-fonts" "$f"; then echo "Fontes do PDF fora do pacote da rota ($f)" | tee -a build.log; status=1; fi
          fi
          if [ $status -eq 0 ]; then
            # Carrega como ESM, igual ao servidor do Next.
            npm pkg set type=module
            npx --yes tsx@4 --tsconfig scripts/tsconfig.teste.json scripts/teste-pdf.tsx teste-os.pdf 2>&1 | tee pdf.log || status=1
          fi
          # Traduções: todo texto da tela precisa existir em inglês e espanhol.
          npx --yes tsx@4 --tsconfig scripts/tsconfig.teste.json scripts/verificar-traducoes.ts 2>&1 | tee traducoes.log || status=1
          if [ $status -ne 0 ]; then
            for f in tipos.log build.log pdf.log traducoes.log; do
              [ -s "$f" ] || continue
              msg=$(grep -vE '^\s*$' "$f" | tail -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::$msg"
            done
            exit 1
          fi
      - name: PDF de exemplo
        if: success()
        run: |
          # Publica o PDF de exemplo numa branch separada, para conferência visual.
          mkdir -p /tmp/art && cp teste-os.pdf teste-os-en.pdf /tmp/art/
          cd /tmp/art
          git init -q -b ci-artefatos
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add teste-os.pdf teste-os-en.pdf
          git commit -q -m "PDF de exemplo (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-artefatos

  pdf-no-servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: PDF gerado pelo servidor do Next
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -o pipefail
          mkdir -p src/app/api/teste-pdf
          cp scripts/rota-teste-pdf.ts src/app/api/teste-pdf/route.ts
          status=0
          npm run build > build.log 2>&1 || status=1
          if [ $status -eq 0 ]; then
            npx next start -p 3100 > server.log 2>&1 &
            for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3100/login && break; sleep 1; done
            code=$(curl -s -o out.pdf -w "%{http_code}" http://localhost:3100/api/teste-pdf)
            head -c 4 out.pdf | grep -q "%PDF" || status=1
            echo "http $code, $(wc -c < out.pdf) bytes" | tee -a server.log
          fi
          if [ $status -ne 0 ]; then
            for f in build.log server.log; do
              [ -s "$f" ] || continue
              msg=$(grep -vE '^\s*$' "$f" | tail -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::$msg"
            done
            exit 1
          fi
